# Explicit GPU overlay activates application OCR.
services:
  vision_bill:
    environment:
      OCR__ENABLED: "true"
      OCR__REQUIRED: "${OCR__REQUIRED:-false}"
      OCR__ALLOW_VISION_FALLBACK: "${OCR__ALLOW_VISION_FALLBACK:-false}"
  paddleocr-service:
    build:
      context: ./paddleocr-service
      dockerfile: Dockerfile.cuda
    image: vision-bill-ocr-cuda:${OCR_IMAGE_TAG:-candidate}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OCR_CUDA_DEVICE_ID:-0}"]
              capabilities: [gpu]
