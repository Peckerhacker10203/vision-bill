name: Verify packaged launcher on Windows

on:
  push:
    branches: [codex/vision-bill-ocr-model-metadata]

permissions:
  contents: write

jobs:
  windows:
    if: github.repository == 'Peckerhacker10203/vision-bill'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Verify extracted bundle in Windows PowerShell
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter tap --test-name-pattern='Windows launcher|Windows PowerShell' scripts/distribution.test.mjs > "${RUNNER_TEMP}/windows-test.log"
          cat "${RUNNER_TEMP}/windows-test.log"
          grep -q '^# skipped 0$' "${RUNNER_TEMP}/windows-test.log"
          node -e 'require("fs").writeFileSync("windows-launcher-verification.json", JSON.stringify({commit: process.env.GITHUB_SHA, runner: process.env.RUNNER_OS, scope: "Windows PowerShell verification and launcher contract"}, null, 2) + "\n")'
          git add -- windows-launcher-verification.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Record verified Windows launcher checks'
          git push origin HEAD:refs/heads/codex/vision-bill-ocr-model-metadata
