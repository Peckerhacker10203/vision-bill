name: Verify Paddle snapshot metadata

on:
  push:
    branches: [codex/vision-bill-ocr-model-metadata]

permissions:
  contents: write

jobs:
  metadata:
    if: github.repository == 'Peckerhacker10203/vision-bill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Verify immutable Paddle downloads and record digests
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          export PYTHONPATH=paddleocr-service
          uv run --no-project --with pydantic==2.13.4 --with packaging==26.2 \
            python paddleocr-service/build/prepare_paddle_models.py \
            --archive-base-url https://paddle-metadata.example/snapshots \
            --output "$scratch/models"
          python3 - "$scratch/models/models.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          records = json.loads(Path(sys.argv[1]).read_text())
          assert len(records) == 4
          for record in records.values():
              provenance = record["provenance"]
              assert provenance["url"].startswith("https://huggingface.co/PaddlePaddle/")
              record["source"] = provenance["url"] + "/resolve/" + provenance["revision"]
          path = Path("paddleocr-service/build/paddle-model-snapshots.json")
          path.write_text(json.dumps(records, indent=2, sort_keys=True) + "\n")
          PY
          git add -f -- paddleocr-service/build/paddle-model-snapshots.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Record verified Paddle model archive metadata'
          git push origin HEAD:refs/heads/codex/vision-bill-ocr-model-metadata
